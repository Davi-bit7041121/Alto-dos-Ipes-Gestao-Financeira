services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./main.html:/usr/share/nginx/html/index.html:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
